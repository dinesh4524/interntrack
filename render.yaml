services:
  - type: web
    name: interntrack-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://interntrack.vercel.app,http://localhost:5173
    healthCheckPath: /health
